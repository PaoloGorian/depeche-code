spring.application.name=office-planner
server.port=8080

# Dati mock (sostituibili con un DB implementando OfficeRepository)
planner.data-file=classpath:data/office-data.json

# Pesi dello scoring
planner.weights.required=100
planner.weights.optional=15
planner.weights.team-member=10
planner.weights.same-skill-in-area=3
planner.weights.mentorship=15

# LLM: qualunque endpoint compatibile OpenAI /chat/completions. Default: GitHub Models.
# Il token si passa da variabile d'ambiente (LLM_API_KEY o GITHUB_TOKEN), mai nel codice.
llm.base-url=${LLM_BASE_URL:https://models.github.ai/inference}
llm.api-key=${LLM_API_KEY:${GITHUB_TOKEN:}}
llm.model=${LLM_MODEL:openai/gpt-4.1-mini}
# Modelli di riserva, separati da virgola: usati se il principale risponde 429/503/404
llm.fallback-models=${LLM_FALLBACK_MODELS:}
