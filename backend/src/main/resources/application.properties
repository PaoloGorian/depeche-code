spring.application.name=office-planner
server.port=8080

# Dati mock (sostituibili con un DB implementando OfficeRepository)
planner.data-file=classpath:data/office-data.json

# Pesi dello scoring
planner.weights.required=100
planner.weights.optional=15
planner.weights.team-member=10
planner.weights.same-skill-in-area=3
planner.weights.mentorship=15

# LLM: qualunque endpoint compatibile OpenAI /chat/completions. Default: Google Gemini.
# La chiave si passa da variabile d'ambiente (GEMINI_API_KEY o LLM_API_KEY), MAI nel codice: il repo e' pubblico.
# GitHub Models: LLM_BASE_URL=https://models.github.ai/inference, LLM_MODEL=openai/gpt-4.1-mini, LLM_REASONING_EFFORT=
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
llm.api-key=${LLM_API_KEY:${GEMINI_API_KEY:}}
llm.model=${LLM_MODEL:gemini-2.5-flash}
llm.reasoning-effort=${LLM_REASONING_EFFORT:none}
